<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect width="256" height="256" fill="#160b2b"/>
  <g class="pulse"><circle cx="128" cy="128" r="72" fill="none" stroke="#ad8fff" stroke-width="12"/></g>
  <circle cx="96" cy="128" r="14" fill="#ff9b3d"/>
  <circle cx="128" cy="128" r="14" fill="#ffc46b"/>
  <circle cx="160" cy="128" r="14" fill="#3fd9ff"/>
</svg>
