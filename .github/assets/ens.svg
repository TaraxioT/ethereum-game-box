<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="Every Box, player, title and cup is a name under gamebox.eth">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1c2333"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag { font-size: 15px; letter-spacing: .16em; }
    .sub { font-size: 24px; fill: #f3f5fa; }
    .wire { fill: none; stroke: #2a3245; stroke-width: 2; }
    .pulse { stroke: url(#g); stroke-dasharray: 40 400; animation: run 4s linear infinite; }
    .pulse.b { animation-delay: 1s; } .pulse.c { animation-delay: 2s; } .pulse.d { animation-delay: 3s; }
    @keyframes run { from { stroke-dashoffset: 440; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; stroke-dasharray: none; opacity: .35; } }
  </style>

  <rect width="1280" height="300" rx="24" fill="#07090f"/>
  <rect width="1280" height="300" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="298" rx="23" fill="none" stroke="#1c2333"/>

  <!-- record kinds -->
  <text x="96" y="80"  class="mono tag" fill="#2ec4ff">BOX LICENSE</text>
  <text x="96" y="130" class="mono tag" fill="#2ec4ff">PLAYER</text>
  <text x="96" y="180" class="mono tag" fill="#ff9f1c">TITLE</text>
  <text x="96" y="230" class="mono tag" fill="#ff9f1c">CUP</text>

  <!-- subnames, right-aligned into the root -->
  <text x="660" y="84"  class="mono sub" text-anchor="end">mumbai-01</text>
  <text x="660" y="134" class="mono sub" text-anchor="end">alice</text>
  <text x="660" y="184" class="mono sub" text-anchor="end">champion.stockduel</text>
  <text x="660" y="234" class="mono sub" text-anchor="end"><tspan fill="#7d8aa6">&lt;cup&gt;.&lt;game&gt;</tspan></text>

  <path class="wire" d="M676 76C730 76 720 155 760 155M676 126C720 126 728 155 760 155M676 176C720 176 728 155 760 155M676 226C730 226 720 155 760 155"/>
  <path class="wire pulse"   d="M676 76C730 76 720 155 760 155"/>
  <path class="wire pulse b" d="M676 126C720 126 728 155 760 155"/>
  <path class="wire pulse c" d="M676 176C720 176 728 155 760 155"/>
  <path class="wire pulse d" d="M676 226C730 226 720 155 760 155"/>
  <circle cx="764" cy="155" r="6" fill="url(#g)"/>

  <text x="784" y="172" class="mono" font-size="50" font-weight="700" fill="url(#g)">.gamebox.eth</text>
  <text x="788" y="212" class="mono tag" fill="#7d8aa6">ENSv2 · SEPOLIA</text>
</svg>
