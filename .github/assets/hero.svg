<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="A HaLo badge tap reaches the Game Box, which signs with its P-256 key and settles on Sepolia">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f1c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="410" y1="0" x2="870" y2="0">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1c2333"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ec4ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2ec4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eye { font-size: 15px; letter-spacing: .18em; fill: #7d8aa6; }
    .num { fill: #ff9f1c; }
    .ring { fill: none; stroke: #2ec4ff; stroke-width: 2.5; stroke-linecap: round; opacity: .15; animation: ping 2.4s ease-out infinite; }
    .ring.b { animation-delay: .3s; } .ring.c { animation-delay: .6s; }
    .flow { stroke-dasharray: 6 10; animation: run 1.2s linear infinite; }
    .halo { animation: breathe 2.4s ease-in-out infinite; transform-origin: 640px 168px; }
    @keyframes ping { 0% { opacity: .15; } 20% { opacity: 1; } 70%, 100% { opacity: .15; } }
    @keyframes run { to { stroke-dashoffset: -32; } }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .ring, .flow, .halo { animation: none; } .ring { opacity: .8; } }
  </style>

  <rect width="1280" height="320" rx="24" fill="#07090f"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#1c2333"/>

  <!-- 01 tap: the badge -->
  <text x="96" y="100" class="mono eye"><tspan class="num">01</tspan>  TAP A BADGE</text>
  <rect x="96" y="120" width="250" height="100" rx="16" fill="#10141e" stroke="#2a3245"/>
  <rect x="118" y="140" width="36" height="28" rx="6" fill="#ff9f1c" opacity=".9"/>
  <path d="M118 150h12m12 0h12M118 158h12m12 0h12M136 140v28" stroke="#07090f" stroke-width="2" opacity=".55"/>
  <text x="168" y="160" class="mono" font-size="12" letter-spacing=".14em" fill="#7d8aa6">HALO</text>
  <text x="118" y="202" class="mono" font-size="17" fill="#f3f5fa">alice.gamebox.eth</text>
  <path class="ring"   d="M362 152a24 24 0 0 1 0 36"/>
  <path class="ring b" d="M374 140a42 42 0 0 1 0 60"/>
  <path class="ring c" d="M386 128a60 60 0 0 1 0 84"/>

  <path class="flow" d="M410 170H540" stroke="url(#f)" stroke-width="2.5" fill="none"/>

  <!-- 02 sign: the Box -->
  <text x="640" y="72" class="mono eye" text-anchor="middle"><tspan class="num">02</tspan>  BOX SIGNS · P-256</text>
  <circle cx="640" cy="168" r="120" fill="url(#glow)" class="halo"/>
  <g transform="translate(565 93) scale(1.17)">
    <path d="M64 16 108 40v48L64 112 20 88V40z" fill="#07090f" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M20 40 64 64l44-24M64 64v48" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round" opacity=".55"/>
    <path d="M64 34 48 62l16 9 16-9z" fill="#f3f5fa"/>
    <path d="M64 75 48 66l16 23 16-23z" fill="#c6cee0"/>
  </g>

  <path class="flow" d="M740 170H870" stroke="url(#f)" stroke-width="2.5" fill="none"/>

  <!-- 03 settle: Sepolia -->
  <text x="890" y="100" class="mono eye"><tspan class="num">03</tspan>  SETTLES ON SEPOLIA</text>
  <rect x="890" y="120" width="300" height="44" rx="12" fill="#1a1206" stroke="#ff9f1c" stroke-opacity=".6"/>
  <text x="910" y="148" class="mono" font-size="15" fill="#ffd9a3">PotSettled <tspan fill="#7d8aa6">·</tspan> 20 test USDC</text>
  <rect x="890" y="176" width="300" height="44" rx="12" fill="#06141c" stroke="#2ec4ff" stroke-opacity=".6"/>
  <text x="910" y="204" class="mono" font-size="14" fill="#b8ecff">champion.stockduel.gamebox.eth</text>

  <rect x="96" y="268" width="1094" height="1.5" fill="url(#h)" opacity=".7"/>
</svg>
