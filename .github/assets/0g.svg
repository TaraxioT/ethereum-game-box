<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="The 0G judge compares the Box's tap log with the game's claims and returns cannot_judge when they differ">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1c2333"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag { font-size: 15px; letter-spacing: .16em; }
    .big { font-size: 34px; }
    .neq { fill: #ff9f1c; font-size: 30px; animation: blink 1.6s ease-in-out infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .neq, .caret { animation: none; } }
  </style>

  <rect width="1280" height="300" rx="24" fill="#07090f"/>
  <rect width="1280" height="300" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="298" rx="23" fill="none" stroke="#1c2333"/>

  <!-- what the Box saw -->
  <text x="96" y="86" class="mono tag" fill="#2ec4ff">BOX TAP LOG · OBSERVED</text>
  <text x="96" y="146" class="mono big" fill="#f3f5fa">12 <tspan font-size="16" fill="#7d8aa6">taps</tspan></text>
  <text x="96" y="206" class="mono big" fill="#f3f5fa">9 <tspan font-size="16" fill="#7d8aa6">taps</tspan></text>

  <text x="300" y="144" class="mono neq">≠</text>
  <text x="300" y="204" class="mono neq">≠</text>

  <!-- what the game claimed -->
  <text x="370" y="86" class="mono tag" fill="#ff9f1c">GAME CLAIMS · 7 + 1,000 × taps</text>
  <text x="370" y="146" class="mono big" fill="#ffd9a3">12,007</text>
  <text x="370" y="206" class="mono big" fill="#ffd9a3">9,007</text>

  <!-- the verdict -->
  <rect x="730" y="64" width="460" height="172" rx="18" fill="#10141e" stroke="url(#g)" stroke-width="2"/>
  <text x="756" y="100" class="mono tag" fill="#7d8aa6" letter-spacing=".1em">0G JUDGE · ENCLAVE SIGNATURE CHECKED</text>
  <text x="756" y="160" class="mono" font-size="40" font-weight="700" fill="#ff9f1c">cannot_judge<tspan class="caret" fill="#2ec4ff">▍</tspan></text>
  <text x="756" y="206" class="mono" font-size="16" fill="#c6cee0">→ every player gets their stake back</text>

  <rect x="96" y="262" width="1094" height="1.5" fill="url(#g)" opacity=".35"/>
</svg>
