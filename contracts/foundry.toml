[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../packages/shared/src/names" },
  { access = "read-write", path = "../packages/shared/src/swap" },
  { access = "read-write", path = "../packages/shared/src/store" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
